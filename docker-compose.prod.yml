services:
  ahorroland-api:
    image: sergioizqdev/ahorroland-backend:latest
    container_name: ahorroland-api
    ports:
      - "8080:80"
      - "8443:443"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION_STRING}
      # ... (Resto de variables JWT y Email igual) ...
      - JwtSettings__SecretKey=${JWT_SECRET_KEY}
      - JwtSettings__Issuer=${JWT_ISSUER:-AhorroLand}
      - JwtSettings__Audience=${JWT_AUDIENCE:-AhorroLand}
      - JwtSettings__ExpirationMinutes=${JWT_EXPIRATION:-720}
      - EmailSettings__SmtpServer=${SMTP_SERVER}
      - EmailSettings__SmtpPort=${SMTP_PORT}
      - EmailSettings__SmtpUser=${SMTP_USER}
      - EmailSettings__SmtpPass=${SMTP_PASS}
      - EmailSettings__FromEmail=${FROM_EMAIL}
      - EmailSettings__FromName=${FROM_NAME:-AhorroLand}
      - ConnectionStrings__Redis=${REDIS_CONNECTION}
      - EmailSettings__SmtpServer=${EMAIL_SMTP_SERVER:-smtp-relay.brevo.com}
      - EmailSettings__SmtpPort=${EMAIL_SMTP_PORT:-587}
      - EmailSettings__SmtpUser=${EMAIL_SMTP_USER}
      - EmailSettings__SmtpPass=${EMAIL_SMTP_PASS}
      - EmailSettings__FromEmail=${EMAIL_FROM_EMAIL}
      - EmailSettings__FromName=${EMAIL_FROM_NAME:-AhorroLand}
      - EmailSettings__EnableSsl=${EMAIL_ENABLE_SSL:-true}
      - Serilog__MinimumLevel__Default=${LOG_LEVEL:-Information}
      - Serilog__WriteTo__0__Name=Console
      - Serilog__WriteTo__1__Name=File
      - Serilog__WriteTo__1__Args__path=/app/logs/ahorroland-.log
      - Serilog__WriteTo__1__Args__rollingInterval=Day
      - Serilog__WriteTo__1__Args__retainedFileCountLimit=7
      - Serilog__WriteTo__1__Args__fileSizeLimitBytes=10485760
      - Serilog__WriteTo__1__Args__rollOnFileSizeLimit=true
    volumes:
      # Logs
      - ./logs/backend:/app/logs
      
      # 📷 NUEVO: Persistencia de Avatares
      # Mapeamos la ruta real de tu VPS a la carpeta virtual de .NET
      - /var/www/ahorroland/storage/avatars:/app/wwwroot/avatars

      # Docker Sock para integración con herramientas
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - ahorroland-red # ✅ Conecta a la red del archivo base
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  frontend:
    container_name: ahorroland-frontend
    image: sergioizqdev/ahorroland-frontend:${FRONTEND_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "3001:80"
    networks:
      - ahorroland-red # ✅ Conecta a la red del archivo base

  logrotate:
    image: blacklabelops/logrotate:latest
    container_name: ahorroland-logrotate
    restart: unless-stopped
    environment:
      - "LOGS_DIRECTORIES=/logs"
      - "LOGROTATE_INTERVAL=daily"
      - "LOGROTATE_COPIES=7"
      - "LOGROTATE_SIZE=10M"
      - "LOGROTATE_COMPRESSION=compress"
      - "LOGROTATE_OLDDIR=/logs/archive"
    volumes:
      - ./logs:/logs
    networks:
      - ahorroland-red